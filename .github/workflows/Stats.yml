name: Generate Stats Cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout github-stats generator source
        uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          path: github-stats-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd github-stats-src
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt

      - name: Generate images
        run: |
          cd github-stats-src
          python3 generate_images.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDED: ""
          EXCLUDED_LANGS: "HTML"
          EXCLUDE_FORKED_REPOS: true

      - name: Copy generated SVGs into this repo
        run: |
          mkdir -p generated
          cp github-stats-src/generated/*.svg generated/

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/*.svg
          git diff --staged --quiet || git commit -m "Update stats images"
          git push
